name: NexusFS CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dfs_metadata_test
          POSTGRES_USER: dfs_admin
          POSTGRES_PASSWORD: dfs_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dfs_admin -d dfs_metadata_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build common module
        run: ./mvnw install -pl common -DskipTests -q

      - name: Run unit tests
        run: ./mvnw test -pl master
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dfs_metadata_test
          SPRING_DATASOURCE_USERNAME: dfs_admin
          SPRING_DATASOURCE_PASSWORD: dfs_password

      - name: Build all modules
        run: ./mvnw package -DskipTests -q

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JARs
        run: ./mvnw package -DskipTests -q

      - name: Build Docker images
        run: docker compose build

      - name: Smoke test
        run: |
          docker compose up -d
          sleep 30
          curl -f http://localhost:8080/api/status || exit 1
          docker compose down
