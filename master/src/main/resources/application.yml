server:
  port: 8080

spring:
  application:
    name: dfs-master

  datasource:
    url: jdbc:postgresql://localhost:5432/dfs_metadata
    username: dfs_admin
    password: dfs_password
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

# DFS configuration
dfs:
  chunk-size-bytes: 4194304          # 4 MB
  replication-factor: 3
  heartbeat-interval-seconds: 5
  node-failure-timeout-seconds: 15
  max-file-size-bytes: 5368709120    # 5 GB
  upload-session-timeout-minutes: 60

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Logging
logging:
  level:
    com.dfs: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
